services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: comanda
      POSTGRES_PASSWORD: comanda
      POSTGRES_DB: comanda
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comanda"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados_postgres:
