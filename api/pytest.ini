[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:.*set_event_loop_policy.*:DeprecationWarning:daphne
    ignore:.*WindowsSelectorEventLoopPolicy.*:DeprecationWarning:daphne
    ignore:No directory at.*staticfiles:UserWarning
